<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14263b">
<title>Crew</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="gate" hidden></div>
<div id="app" hidden>
  <header id="top">
    <h1 id="title">Crew</h1>
    <div id="roster" aria-label="Who is on the crew"></div>
    <button id="open-settings" class="icon-btn" aria-label="Settings"></button>
  </header>

  <main>
    <section id="chat" aria-label="Crew chat">
      <div id="thread" aria-live="polite"></div>
      <div id="typing" hidden></div>
      <div id="prompts"></div>
      <form id="composer">
        <textarea id="draft" rows="1" placeholder="Message your crew" aria-label="Message your crew"></textarea>
        <button id="send" aria-label="Send message"></button>
      </form>
    </section>
    <section id="view" hidden></section>
  </main>

  <nav id="tabs" aria-label="Sections"></nav>
</div>
<dialog id="sheet"></dialog>
<div id="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
