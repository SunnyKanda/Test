# Render Blueprint for the PubPal web app (free plan).
# On start it loads Halifax pubs from OpenStreetMap, falling back to demo pubs if that fails.
# The free plan's disk is wiped on every restart, so approved suggestions don't survive one yet.
services:
  - type: web
    name: pubpal
    runtime: python
    plan: free
    rootDir: pubpal
    buildCommand: pip install -r requirements.txt
    startCommand: (python import_osm.py || python seed_demo.py) && uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PUBPAL_ADMIN_TOKEN
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.7"
