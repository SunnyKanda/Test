# Builds a signed Android App Bundle (.aab) for Google Play.
# Run it from the Actions tab ("Run workflow"), or push a tag: v1.0 (also starts the iOS build) or android-v5 (Android only).
# Needs repo secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android release (Google Play)

on:
  workflow_dispatch:
  push:
    tags: ["v*", "android-v*"]

jobs:
  build:
    # Pinned: Playwright 1.56 (used by the purchase tests) can't install Chromium on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: nikke-bol-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nikke-bol-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - run: npm ci
      - name: Purchase tests (fake App Store / Google Play)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          npm run test:unlock
      - run: npm run build && npx cap sync android
      - name: Upload key
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build signed bundle
        working-directory: nikke-bol-app/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon bundleRelease
      - name: Check it is signed
        run: jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: nikke-bol-android-${{ github.run_number }}
          path: nikke-bol-app/android/app/build/outputs/bundle/release/app-release.aab
